# Shared checks, called by ci.yml and publish.yml.
name: Verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Format, analyze, codegen, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chat_message_ui_kit
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The package's pubspec.lock is gitignored (it's a library), so the
      # lockfile can't be enforced here the way chat_message_core does.
      - name: Install dependencies
        run: flutter pub get

      - name: Install example dependencies
        run: flutter pub get
        working-directory: chat_message_ui_kit/example

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Analyze example
        run: flutter analyze --fatal-infos
        working-directory: chat_message_ui_kit/example

      - name: Check generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          if ! git diff --exit-code -- '*.g.dart'; then
            echo "::error::Generated *.g.dart files are stale. Run 'dart run build_runner build -d' and commit the result."
            exit 1
          fi

      - name: Test
        run: flutter test
